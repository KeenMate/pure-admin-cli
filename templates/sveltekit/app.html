<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		{{#FONT_AWESOME}}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
		{{/FONT_AWESOME}}<!-- Load theme CSS before render (blocking to prevent FOUC).
		     Reads theme from localStorage → cookie → default. -->
		<script>
			(function() {
				var validThemes = [{{THEME_IDS_QUOTED}}];
				var theme = localStorage.getItem('theme');
				if (!theme || validThemes.indexOf(theme) === -1) {
					var match = document.cookie.match(/(^| )theme=([^;]+)/);
					theme = match ? match[2] : '{{DEFAULT_THEME}}';
				}
				if (validThemes.indexOf(theme) === -1) theme = '{{DEFAULT_THEME}}';
				var link = document.createElement('link');
				link.id = 'pa-theme-css';
				link.rel = 'stylesheet';
				link.href = '/themes/' + theme + '/css/' + theme + '.css';
				document.currentScript.parentNode.insertBefore(link, document.currentScript);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function() {
				// Apply theme mode from localStorage (prevents dark/light flash)
				var themeMode = localStorage.getItem('theme-mode') || '__DEFAULT_MODE__';
				var resolvedMode;
				if (themeMode === 'auto') {
					resolvedMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				} else {
					resolvedMode = themeMode;
				}
				document.body.classList.add('pa-mode-' + resolvedMode);
				var colorVariant = localStorage.getItem('color-variant') || '__DEFAULT_VARIANT__';
				if (colorVariant) document.body.classList.add(colorVariant);

				// Apply sidebar hidden state
				if (localStorage.getItem('sidebar-hidden') === 'true') {
					document.body.classList.add('sidebar-hidden');
				}

				// Apply compact mode
				if (localStorage.getItem('compact-mode') === 'true') {
					document.body.classList.add('compact-mode');
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
