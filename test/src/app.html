<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Theme CSS (includes pure-admin-core) -->
		<link rel="stylesheet" href="/themes/corporate/css/corporate.css" />
		<!-- data-pa="floating-ui-cdn" -->
		<script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.0"></script>
		<script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.3"></script>
		<!-- /data-pa="floating-ui-cdn" -->
		<!-- data-pa="page-loader-css" -->
		<style>
			.page-loader {
				position: fixed; top: 0; left: 0; width: 100%; height: 100%;
				background: var(--page-loader-bg, rgba(26, 26, 26, 0.95));
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				display: flex; align-items: center; justify-content: center;
				z-index: 99999;
				transition: opacity 0.15s ease, visibility 0.15s ease;
			}
			.page-loader.loaded { opacity: 0; visibility: hidden; }
			.page-loader__spinner {
				width: 50px; height: 50px;
				border: 4px solid var(--page-loader-spinner-border, #333);
				border-top-color: var(--page-loader-spinner-accent, #0066cc);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
			}
			@keyframes spin { to { transform: rotate(360deg); } }
		</style>
		<!-- /data-pa="page-loader-css" -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- data-pa="page-loader-html" -->
		<div class="page-loader" id="pageLoader">
			<div class="page-loader__spinner"></div>
		</div>
		<!-- /data-pa="page-loader-html" -->
		<!-- data-pa="page-loader-script" -->
		<script>
			(function() {
				var loader = document.getElementById('pageLoader');
				var fontsReady = false, appReady = false;
				function hide() {
					if (!fontsReady || !appReady) return;
					requestAnimationFrame(function() {
						loader.classList.add('loaded');
						setTimeout(function() { loader.remove(); }, 80);
					});
				}
				if (document.fonts && document.fonts.ready) {
					Promise.race([
						document.fonts.ready,
						new Promise(function(r) { setTimeout(r, 1000); })
					]).then(function() { fontsReady = true; hide(); });
				} else {
					window.addEventListener('load', function() { fontsReady = true; hide(); });
				}
				window.__pageLoaderReady = function() { appReady = true; hide(); };
				setTimeout(function() { fontsReady = appReady = true; hide(); }, 3000);
			})();
		</script>
		<!-- /data-pa="page-loader-script" -->
		<script>
			(function() {
				var sidebarHidden = localStorage.getItem('sidebar-hidden') === 'true';
				if (sidebarHidden) document.body.classList.add('sidebar-hidden');
				var themeMode = localStorage.getItem('theme-mode') || 'light';
				var resolvedMode;
				if (themeMode === 'auto') {
					resolvedMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				} else {
					resolvedMode = themeMode;
				}
				document.body.classList.add('pa-mode-' + resolvedMode);
				var colorVariant = localStorage.getItem('color-variant') || '';
				if (colorVariant) document.body.classList.add(colorVariant);
				var sidebarBehavior = localStorage.getItem('sidebar-behavior');
				if (sidebarBehavior === 'icon-collapse') {
					document.body.classList.add('sidebar-icon-collapse');
				}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
